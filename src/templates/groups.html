{% extends "base.html" %}{% from "_m.html" import icon %}{% block h %}گروه‌های کالا{% endblock %}
{% block body %}
<div class="card"><h3>{{ icon('plus') }} گروه جدید</h3>
<form method="post" class="f"><div><label>کد گروه (خالی = خودکار)</label><input name="code" placeholder="خودکار"></div><div><label>نام گروه</label><input name="name" required></div>
<div><label>گروه بالادست (اختیاری)</label><select name="parent_id"><option value="">—</option>{% for g_ in rows %}<option value="{{ g_.id }}">{{ g_.code }} - {{ g_.name }}</option>{% endfor %}</select></div>
<div><button class="btn g">ثبت گروه</button></div></form></div>
<div class="card"><h3>گروه‌ها</h3><table><tr><th>کد</th><th>نام</th><th>بالادست</th><th class="n">تعداد کالا</th><th>فعال</th><th></th></tr>
{% for g_ in rows %}<tr><form method="post"><input type="hidden" name="id" value="{{ g_.id }}">
<td><input name="code" value="{{ g_.code }}" style="width:90px"></td><td><input name="name" value="{{ g_.name }}"></td>
<td><select name="parent_id"><option value="">—</option>{% for p in rows if p.id != g_.id %}<option value="{{ p.id }}" {{ 'selected' if p.id==g_.parent_id }}>{{ p.name }}</option>{% endfor %}</select></td>
<td class="n"><a href="/items?group={{ g_.id }}">{{ g_.n }}</a></td><td><input type="checkbox" name="active" value="1" {{ 'checked' if g_.active }} style="width:auto"></td>
<td style="white-space:nowrap"><button class="btn sm">ذخیره</button> <button class="btn sm r" formaction="/delete/group/{{ g_.id }}" formnovalidate onclick="return confirm('«{{ g_.name }}» حذف شود؟ (فقط اگر در هیچ سندی استفاده نشده باشد)')">حذف</button></td></form></tr>
{% else %}<tr><td colspan="6" class="muted">گروهی تعریف نشده است.</td></tr>{% endfor %}</table></div>
{% endblock %}
